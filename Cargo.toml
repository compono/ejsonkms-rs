[package]
name = "ejsonkms"
version = "2.0.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Trung Lê <8@tle.id.au>"]
description = "Manage encrypted secrets using EJSON & AWS KMS"
license = "MIT"
repository = "https://github.com/runlevel5/ejsonkms-rs"
readme = "README.md"
exclude = ["/.github", "/Formula"]
keywords = ["encryption", "secrets", "json", "kms", "aws"]
categories = ["cryptography", "command-line-utilities"]

[dependencies]
ejson = "2.0"

# AWS KMS
# default-features = false drops aws-sdk-kms's legacy TLS stack (hyper 0.14,
# h2 0.3, rustls 0.21), which carries known RUSTSEC advisories; only the
# modern hyper 1.x client is used.
aws-config = "1"
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { version = "1", features = ["rt"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TOML
toml = "1.0"

# YAML
serde_norway = "0.9"

# Encoding
base64 = "0.23"

# Error handling
thiserror = "2"

# Warnings from the ejson library (printed to stderr by the CLI)
log = "0.4"

# Secret hygiene
zeroize = "1.8"

# Atomic, owner-only output files
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# Process hardening (disable core dumps)
rustix = { version = "1.1", features = ["process"] }

[[bin]]
name = "ejsonkms"
path = "src/main.rs"

[lib]
name = "ejsonkms"
path = "src/lib.rs"

# Keep integer overflow checks in release builds of this crate (dependencies
# keep the default), so an arithmetic bug panics instead of wrapping silently.
[profile.release.package.ejsonkms]
overflow-checks = true

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[lints.clippy]
# No panics in library or CLI code; tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Printing belongs to the CLI, which allows these explicitly.
print_stdout = "warn"
print_stderr = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
needless_raw_string_hashes = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
