[package]
name = "ejsonkms"
version = "3.1.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Trung Lê <8@tle.id.au>"]
description = "Manage encrypted secrets using EJSON & AWS KMS"
license = "MIT"
repository = "https://github.com/runlevel5/ejsonkms-rs"
readme = "README.md"
exclude = ["/.github", "/Formula"]
keywords = ["encryption", "secrets", "json", "kms", "aws"]
categories = ["cryptography", "command-line-utilities"]

[dependencies]
ejson = "2.0"

# AWS KMS
# default-features = false drops aws-sdk-kms's legacy TLS stack (hyper 0.14,
# h2 0.3, rustls 0.21), which carries known RUSTSEC advisories; only the
# modern hyper 1.x client is used.
aws-config = "1"
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TOML
toml = "1.0"

# YAML
serde_norway = "0.9"

# Encoding
base64 = "0.23"

# Error handling
thiserror = "2"

# Secret hygiene
zeroize = "1.8"

# Only the command-line tool needs the rest (the `cli` feature).
clap = { version = "4", features = ["derive", "env"], optional = true }
# `ejsonkms completions` and `ejsonkms man`
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.3", optional = true }
# Warnings from the ejson library, printed to stderr
log = { version = "0.4", optional = true }
# Atomic, owner-only output files
tempfile = { version = "3", optional = true }
# The runtime the commands run on
tokio = { version = "1", features = ["rt"], optional = true }

[target.'cfg(unix)'.dependencies]
# Process hardening (disable core dumps)
rustix = { version = "1.1", features = ["process"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt"] }

[features]
default = ["cli"]
# The `ejsonkms` command-line tool. Library users can turn it off with
# `default-features = false` to avoid building its dependencies.
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:clap_mangen",
    "dep:log",
    "dep:rustix",
    "dep:tempfile",
    "dep:tokio",
]

[[bin]]
name = "ejsonkms"
path = "src/main.rs"
required-features = ["cli"]

# Runs the compiled binary.
[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[lib]
name = "ejsonkms"
path = "src/lib.rs"

# Keep integer overflow checks in release builds of this crate (dependencies
# keep the default), so an arithmetic bug panics instead of wrapping silently.
[profile.release.package.ejsonkms]
overflow-checks = true

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[lints.clippy]
# No panics in library or CLI code; tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Printing belongs to the CLI, which allows these explicitly.
print_stdout = "warn"
print_stderr = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
needless_raw_string_hashes = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
